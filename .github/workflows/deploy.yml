name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write production env (from GitHub variables)
        # .env.production 被 .gitignore 忽略，不会进入仓库，
        # 因此在这里从 GitHub 仓库 Variables 动态生成，供 vite build 读取。
        run: |
          : > .env.production
          {
            echo "VITE_ANALYTICS_ENDPOINT=${{ vars.VITE_ANALYTICS_ENDPOINT }}"
            echo "VITE_GITHUB_TOKEN_PROXY_URL=${{ vars.VITE_GITHUB_TOKEN_PROXY_URL }}"
            echo "VITE_GOOGLE_TOKEN_PROXY_URL=${{ vars.VITE_GOOGLE_TOKEN_PROXY_URL }}"
            echo "VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}"
          } >> .env.production

      - name: Install & build
        run: |
          npm ci
          npm run build
        env:
          # GitHub Pages 子路径 = 仓库名；自动跟随仓库名，改名无需改代码
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages 无 SPA fallback：把 index.html 复制为 404.html，
      # 使 /settings、/github-callback 等深链刷新时也能加载应用。
      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4