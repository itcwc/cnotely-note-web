# ============================================================
# Nginx 配置片段：GitHub OAuth token 代理（粘贴到 server {} 块内）
# ============================================================
#
# 解决浏览器直接请求 GitHub access_token 接口时的 CORS 问题。
# GitHub 不在该接口设置 Access-Control-Allow-Origin 响应头，
# 必须通过同源服务端代理中转。
#
# 使用方式：将以下 location 块加入你的 Nginx server {} 配置

location = /api/github/token {
    proxy_pass https://github.com/login/oauth/access_token;
    proxy_ssl_server_name on;
    proxy_set_header Host github.com;
    proxy_set_header Accept application/json;
    # 不转发浏览器的 Origin/Referer，避免 GitHub 拒绝
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    # 隐藏 GitHub 返回的部分头，防止重复
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
}

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}
