name = "cnotely-google-oauth"
main = "google-oauth-worker.js"
compatibility_date = "2024-09-01"

# 部署后 Worker 的 URL 格式：https://cnotely-google-oauth.<你的子域>.workers.dev
# 前端通过 VITE_GOOGLE_TOKEN_PROXY_URL 环境变量指向这个 URL

# client_secret 不要写在这里！
# 用 wrangler secret put GOOGLE_CLIENT_SECRET 设置

[vars]
# 这里可以放非敏感变量，目前不需要
